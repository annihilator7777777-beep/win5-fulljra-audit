name: MULTIBET racedata 2026-current runner parity v0.2.2 result-row reconciliation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/m2026fix2.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned racedata source
        uses: actions/checkout@v6
        with:
          repository: leostudiono1/racedata
          ref: 496bd254f96f0a370616d350f862153f2f5cece0
          path: racedata
          fetch-depth: 1

      - name: Verify pinned source commit
        shell: bash
        run: |
          test "$(git -C racedata rev-parse HEAD)" = "496bd254f96f0a370616d350f862153f2f5cece0"

      - name: Materialize exact v0.2.2 auditor and regression
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > multibet_racedata_full_runner_parity_audit_v0_2_2_candidate.py
          echo '' | base64 -d | gzip -d > test_multibet_racedata_full_runner_parity_audit_v0_2_2_candidate.py
          test "$(sha256sum multibet_racedata_full_runner_parity_audit_v0_2_2_candidate.py | awk '{print $1}')" = "99c5253ada0f3133586fb72d5a20bfa2e2e2e1533efc3c01779b63b8149a7eda"
          test "$(sha256sum test_multibet_racedata_full_runner_parity_audit_v0_2_2_candidate.py | awk '{print $1}')" = "f8eeeade2516fbea95ac11036012f05dc953d48f94fad7a7ae64e001eb32fa8c"
          python -m py_compile multibet_racedata_full_runner_parity_audit_v0_2_2_candidate.py
          python -m py_compile test_multibet_racedata_full_runner_parity_audit_v0_2_2_candidate.py
          python test_multibet_racedata_full_runner_parity_audit_v0_2_2_candidate.py

      - name: Run full 2026-current fail-closed gate
        id: audit2026
        continue-on-error: true
        run: |
          python multibet_racedata_full_runner_parity_audit_v0_2_2_candidate.py \
            --jra-root racedata/data/archive/2026 \
            --netkeiba-root racedata/data/netkeiba/races/2026 \
            --year 2026 \
            --expected-final-races 2610 \
            --report RACEDATA_FULL_2026_CURRENT_RUNNER_PARITY_V022.json \
            --ledger PORTABLE_BT_LEDGER_2026_CURRENT_V022.csv

      - name: Seal provenance and hashes
        if: always()
        shell: bash
        run: |
          cat > RACEDATA_FULL_2026_CURRENT_PROVENANCE_V022.txt <<'EOF'
          source_repository=leostudiono1/racedata
          source_commit=496bd254f96f0a370616d350f862153f2f5cece0
          auditor=MULTIBET_RACEDATA_FULL_RUNNER_PARITY_AUDIT_20260929_v0.2.2_RESULT_ROW_RECONCILIATION_CANDIDATE
          auditor_sha256=99c5253ada0f3133586fb72d5a20bfa2e2e2e1533efc3c01779b63b8149a7eda
          regression_sha256=f8eeeade2516fbea95ac11036012f05dc953d48f94fad7a7ae64e001eb32fa8c
          regression_status=PASS_42_OF_42_LOCAL_PREUPLOAD
          expected_official_completed_races=2610
          target=2026 current final race universe through pinned source commit; runner gate restricted to JRA turf/dirt finals
          reconciliation=result-table-row geometry plus fail-closed identity agreement; proven cancelled-null and external-profile auxiliaries only
          action_authority=false
          predictive_credit=0
          financial_credit=0
          EOF
          sha256sum multibet_racedata_full_runner_parity_audit_v0_2_2_candidate.py test_multibet_racedata_full_runner_parity_audit_v0_2_2_candidate.py RACEDATA_FULL_2026_CURRENT_RUNNER_PARITY_V022.json > RACEDATA_FULL_2026_CURRENT_SHA256_V022.txt || true
          if [ -f PORTABLE_BT_LEDGER_2026_CURRENT_V022.csv ]; then sha256sum PORTABLE_BT_LEDGER_2026_CURRENT_V022.csv >> RACEDATA_FULL_2026_CURRENT_SHA256_V022.txt; fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multibet-racedata-full-2026-current-runner-parity-v022-496bd254
          path: |
            RACEDATA_FULL_2026_CURRENT_RUNNER_PARITY_V022.json
            PORTABLE_BT_LEDGER_2026_CURRENT_V022.csv
            RACEDATA_FULL_2026_CURRENT_PROVENANCE_V022.txt
            RACEDATA_FULL_2026_CURRENT_SHA256_V022.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce PASS
        if: always()
        shell: bash
        run: |
          python - <<'PY_CHECK'
          import json, pathlib, sys
          p=pathlib.Path('RACEDATA_FULL_2026_CURRENT_RUNNER_PARITY_V022.json')
          if not p.exists():
              print('FAIL: audit report missing'); sys.exit(2)
          r=json.loads(p.read_text())
          keys=['status','expected_official_final_race_count','race_count','netkeiba_race_count','flat_final_race_count',
                'jra_active_runner_count','netkeiba_active_runner_count','netkeiba_joined_runner_count',
                'official_final_race_count_mismatch_count','missing_runner_count','extra_runner_count',
                'duplicate_horse_no_count','conflicting_jra_duplicate_horse_no_count','unrecognized_jra_null_runner_count',
                'jra_external_profile_aux_excluded_count','jra_cancelled_null_aux_excluded_count',
                'jra_result_row_selected_duplicate_horse_no_count','missing_horse_id_count','non_10_digit_horse_id_count',
                'duplicate_horse_id_count','horse_name_mismatch_count','jra_name_truncation_reconciled_count',
                'no_winner_race_count','canonical_race_join_failure_count','fatal_error']
          print(json.dumps({k:r.get(k) for k in keys},ensure_ascii=False,indent=2))
          sys.exit(0 if r.get('status')=='PASS' else 2)
          PY_CHECK
