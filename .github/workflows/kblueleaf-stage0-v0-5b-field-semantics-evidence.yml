      - name: Run Stage0.5b regression
        shell: bash
        run: |
          set -euo pipefail
          python test_extract_kblueleaf_stage0_5b_field_semantics_evidence.py

      - name: Download exact public KBlueLeaf DB once
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output all_races_2005-2024.db \
            'https://huggingface.co/datasets/KBlueLeaf/jp-racing-horse/resolve/main/all_races_2005-2024.db?download=true'
          test "$(stat -c%s all_races_2005-2024.db)" = "717680640"
          echo '7828af205838d148f6bca70870d4ab152ea6b54430093dcf3159d23583252eab  all_races_2005-2024.db' | sha256sum -c -

      - name: Export 599-pair field semantics evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stage0_5b_out
          python extract_kblueleaf_stage0_5b_field_semantics_evidence.py \
            all_races_2005-2024.db \
            KBLUELEAF_STAGE0_5_FIELD_MISMATCH_PAIRS_599_v0.1.csv \
            OFFICIAL_JRA_FOUR_HORSE_FORM_SENTINEL_FIXTURE_v0.1.csv \
            -o stage0_5b_out
          cp WIN5_KBLUELEAF_FIELD_SIZE_SEMANTICS_ERRATUM_LOCK_20260910_v0.1.md stage0_5b_out/

      - name: Assert predictive firewall remains closed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f stage0_5b_out/KBLUELEAF_STAGE0_5B_FIELD_SEMANTICS_REPORT_v0.1.json
          python - <<'PY2'
          import json
          p='stage0_5b_out/KBLUELEAF_STAGE0_5B_FIELD_SEMANTICS_REPORT_v0.1.json'
          x=json.load(open(p,encoding='utf-8'))
          g=x.get('governance',{})
          assert g.get('predictive_metrics_read') is False
          assert g.get('tail293_top1_top2_mrr_read') is False
          assert g.get('tail293_form_computed') is False
          assert g.get('production_change')=='NONE'
          print('FIREWALL PASS')
          PY2

      - name: Upload small Stage0.5b evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kblueleaf-stage0-v0-5b-field-semantics-evidence
          path: stage0_5b_out/
          if-no-files-found: error
          retention-days: 30

      - name: Remove raw DB
        if: always()
        shell: bash
        run: rm -f all_races_2005-2024.db
