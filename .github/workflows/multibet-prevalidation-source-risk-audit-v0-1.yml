      - name: Download exact frozen KBlueLeaf DB
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30             -o all_races_2005-2024.db             'https://huggingface.co/datasets/KBlueLeaf/jp-racing-horse/resolve/main/all_races_2005-2024.db?download=true'
          test "$(stat -c%s all_races_2005-2024.db)" = '717680640'
          echo '7828af205838d148f6bca70870d4ab152ea6b54430093dcf3159d23583252eab  all_races_2005-2024.db' | sha256sum -c -

      - name: Run fail-through prevalidation source audit
        shell: bash
        run: |
          set -euo pipefail
          python multibet_prevalidation_source_audit_v0_1.py | tee prevalidation_source_audit_stdout.json

      - name: Assert only execution firewall
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('prevalidation_source_audit/PREVALIDATION_SOURCE_AUDIT_REPORT_v0.1.json'))
          assert x['status']=='PASS_PREVALIDATION_SOURCE_RISK_SCAN_COMPLETE'
          assert x['predictive_metrics_read'] is False
          assert x['winner_labels_used_for_model_selection'] is False
          assert x['odds_popularity_payout_used'] is False
          assert x['posthoc_threshold_selected'] is False
          assert x['action_influence']==0
          print('PASS_PREVALIDATION_FIREWALL_REVIEW_REQUIRED')
          PY

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: multibet-prevalidation-source-risk-audit-v0-1
          path: |
            prevalidation_source_audit/
            prevalidation_source_audit_stdout.json
          if-no-files-found: error
          retention-days: 30
