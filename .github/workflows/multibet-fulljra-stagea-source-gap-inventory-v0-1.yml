      - name: Download exact frozen KBlueLeaf DB
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            -o all_races_2005-2024.db \
            'https://huggingface.co/datasets/KBlueLeaf/jp-racing-horse/resolve/main/all_races_2005-2024.db?download=true'
          test "$(stat -c%s all_races_2005-2024.db)" = '717680640'
          echo '7828af205838d148f6bca70870d4ab152ea6b54430093dcf3159d23583252eab  all_races_2005-2024.db' | sha256sum -c -

      - name: Run fail-through source-gap inventory over frozen 16639
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source_gap_inventory
          python inventory_fulljra_speed_stagea_source_gaps_v0_1.py \
            --db all_races_2005-2024.db \
            --expected-flat EXPECTED_JRA_FLAT_RACE_IDS_2016_2020_CANONICAL_v0.1.csv \
            --outdir source_gap_inventory | tee source_gap_inventory_stdout.json
          python - <<'PY_GATE'
          import json, pathlib
          p=pathlib.Path('source_gap_inventory/FULLJRA_SPEED_STAGEA_SOURCE_GAP_REPORT_v0.1.json')
          x=json.loads(p.read_text())
          assert x['status']=='PASS_SOURCE_GAP_INVENTORY_COMPLETE'
          assert x['classification']=='SOURCE_ONLY_COMPLETE_SCAN_NO_PREDICTIVE_SCORING'
          assert x['races']==16639
          assert x['expected_flat_sha256']=='0040468145d620c6ffa06027fb9ec9926495b0817eb6d7ad22e9a9e9e10eaf02'
          assert x['predictive_metrics_read'] is False
          assert x['winner_labels_used'] is False
          assert x['ranking_values_exported'] is False
          assert x['odds_popularity_payout_read'] is False
          assert x['posthoc_threshold_selected'] is False
          print(json.dumps(x, indent=2, sort_keys=True))
          PY_GATE

      - name: Seal inventory hashes
        if: always()
        shell: bash
        run: |
          if [ -d source_gap_inventory ]; then
            find source_gap_inventory -type f ! -name SHA256SUMS_SOURCE_GAP_INVENTORY.txt -print0 | sort -z | xargs -0 sha256sum > source_gap_inventory/SHA256SUMS_SOURCE_GAP_INVENTORY.txt || true
          fi

      - name: Upload source-gap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multibet-fulljra-stagea-source-gap-inventory-v0-1
          path: |
            source_gap_inventory/
            source_gap_inventory_stdout.json
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup raw DB
        if: always()
        shell: bash
        run: rm -f all_races_2005-2024.db
