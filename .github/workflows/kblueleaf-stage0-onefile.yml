      - name: Download exact public KBlueLeaf DB
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output all_races_2005-2024.db \
            'https://huggingface.co/datasets/KBlueLeaf/jp-racing-horse/resolve/main/all_races_2005-2024.db?download=true'
          test "$(stat -c%s all_races_2005-2024.db)" = "717680640"
          echo '7828af205838d148f6bca70870d4ab152ea6b54430093dcf3159d23583252eab  all_races_2005-2024.db' | sha256sum -c -

      - name: Run no-prediction Stage0 v0.2 gate
        shell: bash
        run: |
          set -euo pipefail
          python audit_kblueleaf_stage0_no_prediction_v0_2.py \
            all_races_2005-2024.db \
            WIN5_FULL_JRA_FORM_DEVELOPMENT_CANDIDATES_2016_2020_v0.1.csv \
            JRA_OFFICIAL_COMPLETED_RACE_IDS_2016_2020_v0.1.csv \
            KBLUELEAF_EXTERNAL_COMPLETENESS_SENTINEL_64_v0_1.csv \
            -o KBLUELEAF_STAGE0_V0_2_AUDIT.json

      - name: Record immutable checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            sha256sum audit_kblueleaf_stage0_no_prediction_v0_2.py
            sha256sum WIN5_FULL_JRA_FORM_DEVELOPMENT_CANDIDATES_2016_2020_v0.1.csv
            sha256sum JRA_OFFICIAL_COMPLETED_RACE_IDS_2016_2020_v0.1.csv
            sha256sum KBLUELEAF_EXTERNAL_COMPLETENESS_SENTINEL_64_v0_1.csv
            test ! -f all_races_2005-2024.db || sha256sum all_races_2005-2024.db
            test ! -f KBLUELEAF_STAGE0_V0_2_AUDIT.json || sha256sum KBLUELEAF_STAGE0_V0_2_AUDIT.json
          } > SHA256SUMS_STAGE0_V0_2.txt

      - name: Upload small audit evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kblueleaf-stage0-v0-2-audit
          path: |
            KBLUELEAF_STAGE0_V0_2_AUDIT.json
            SHA256SUMS_STAGE0_V0_2.txt
          retention-days: 7

      - name: Remove raw DB
        if: always()
        shell: bash
        run: rm -f all_races_2005-2024.db
