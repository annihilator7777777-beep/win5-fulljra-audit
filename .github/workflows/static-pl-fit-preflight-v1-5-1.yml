      - name: Extract status-aware source evidence with complete-line UTF8 adapter
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source_evidence universe_out
          python extract_zennifa_static_pl_source_evidence_v0_2.py zennifa_archive.zip -o source_evidence

      - name: Build exact expected flat universe 2005-2020
        shell: bash
        run: |
          set -euo pipefail
          python build_static_pl_expected_flat_universe_v0_2_hashguard.py \
            apiss2_ids \
            source_evidence/ZENNIFA_JRA_ALL_RACE_IDS_2005_2020_v0.1.csv \
            source_evidence/ZENNIFA_JRA_OBSTACLE_RACE_IDS_2005_2020_v0.1.csv \
            -o universe_out
          mkdir -p static_pl_source_bundle
          cp -a source_evidence universe_out static_pl_source_bundle/
          (cd static_pl_source_bundle && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Download exact frozen public KBlueLeaf DB
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output all_races_2005-2024.db \
            'https://huggingface.co/datasets/KBlueLeaf/jp-racing-horse/resolve/main/all_races_2005-2024.db?download=true'
          test "$(stat -c%s all_races_2005-2024.db)" = "717680640"
          echo '7828af205838d148f6bca70870d4ab152ea6b54430093dcf3159d23583252eab  all_races_2005-2024.db' | sha256sum -c -

      - name: Inventory Horse-side stable-ID roster gaps without predictive scoring
        shell: bash
        run: |
          set -euo pipefail
          python inventory_static_pl_horseside_source_gaps_v0_5_relevant_prefilter_idguard.py \
            all_races_2005-2024.db \
            universe_out/EXPECTED_JRA_FLAT_RACE_IDS_2005_2020_STATIC_PL_v0.2.csv \
            --formal-db-sha \
            -o static_pl_source_bundle/STATIC_PL_HORSESIDE_SOURCE_GAP_INVENTORY_v0.5.csv \
            | tee static_pl_source_bundle/STATIC_PL_HORSESIDE_SOURCE_GAP_INVENTORY_REPORT_v0.5.json
          python - <<'PY_INV_CHECK'
          import json
          p='static_pl_source_bundle/STATIC_PL_HORSESIDE_SOURCE_GAP_INVENTORY_REPORT_v0.5.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['status']=='PASS_STATIC_PL_SOURCE_GAP_INVENTORY'
          assert x['predictive_metrics_read'] is False
          assert x['target_labels_read'] is False
          print('HORSESIDE GAP INVENTORY COMPLETE:', x['flagged_races'], 'flagged races')
          PY_INV_CHECK
          python summarize_static_pl_recovery_workload_v0_1.py \
            static_pl_source_bundle/STATIC_PL_HORSESIDE_SOURCE_GAP_INVENTORY_v0.5.csv \
            -o static_pl_source_bundle/STATIC_PL_RECOVERY_WORKLOAD_REPORT_v0.1.json \
            --flagged-csv static_pl_source_bundle/STATIC_PL_RECOVERY_WORKLOAD_FLAGGED_v0.1.csv
          (cd static_pl_source_bundle && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          python diagnose_static_pl_source_recovery_v0_1.py \
            all_races_2005-2024.db \
            static_pl_source_bundle/STATIC_PL_HORSESIDE_SOURCE_GAP_INVENTORY_v0.5.csv \
            source_evidence/ZENNIFA_JRA_ABNORMAL_STATUS_ROWS_2005_2020_v0.1.csv \
            -o static_pl_source_bundle/STATIC_PL_SOURCE_RECOVERY_DIAGNOSTIC_REPORT_v0.1.json \
            --details static_pl_source_bundle/STATIC_PL_SOURCE_RECOVERY_DIAGNOSTIC_DETAILS_v0.1.csv
          (cd static_pl_source_bundle && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          python diagnose_static_pl_source_recovery_v0_2.py \
            all_races_2005-2024.db \
            static_pl_source_bundle/STATIC_PL_HORSESIDE_SOURCE_GAP_INVENTORY_v0.5.csv \
            source_evidence/ZENNIFA_JRA_ABNORMAL_STATUS_ROWS_2005_2020_v0.1.csv \
            -o static_pl_source_bundle/STATIC_PL_SOURCE_RECOVERY_DIAGNOSTIC_REPORT_v0.2.json \
            --details static_pl_source_bundle/STATIC_PL_SOURCE_RECOVERY_DIAGNOSTIC_DETAILS_v0.2.csv
          (cd static_pl_source_bundle && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Reconcile remaining source identities without outcome payload
        run: |
          python reconcile_static_pl_source_identity_v1_0.py \
            all_races_2005-2024.db \
            static_pl_source_bundle/STATIC_PL_HORSESIDE_SOURCE_GAP_INVENTORY_v0.5.csv \
            source_evidence/ZENNIFA_JRA_ABNORMAL_STATUS_ROWS_2005_2020_v0.1.csv \
            -o static_pl_source_bundle/STATIC_PL_SOURCE_IDENTITY_RECONCILIATION_REPORT_v1.0.json \
            --details static_pl_source_bundle/STATIC_PL_SOURCE_IDENTITY_RECONCILIATION_DETAILS_v1.0.csv
          (cd static_pl_source_bundle && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Diagnose noncanonical source horse entities for remaining HOLD races
        run: |
          python diagnose_static_pl_source_entity_v1_1.py \
            all_races_2005-2024.db \
            static_pl_source_bundle/STATIC_PL_SOURCE_IDENTITY_RECONCILIATION_DETAILS_v1.0.csv \
            source_evidence/ZENNIFA_JRA_ABNORMAL_STATUS_ROWS_2005_2020_v0.1.csv \
            -o static_pl_source_bundle/STATIC_PL_SOURCE_ENTITY_DIAGNOSTIC_REPORT_v1.1.json \
            --details static_pl_source_bundle/STATIC_PL_SOURCE_ENTITY_DIAGNOSTIC_DETAILS_v1.1.csv
          (cd static_pl_source_bundle && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Diagnose same-name candidates by outcome-blind temporal activity
        run: |
          python diagnose_static_pl_temporal_identity_v1_2.py \
            all_races_2005-2024.db \
            static_pl_source_bundle/STATIC_PL_SOURCE_IDENTITY_RECONCILIATION_DETAILS_v1.0.csv \
            source_evidence/ZENNIFA_JRA_ABNORMAL_STATUS_ROWS_2005_2020_v0.1.csv \
            -o static_pl_source_bundle/STATIC_PL_TEMPORAL_IDENTITY_DIAGNOSTIC_REPORT_v1.2.json \
            --details static_pl_source_bundle/STATIC_PL_TEMPORAL_IDENTITY_DIAGNOSTIC_DETAILS_v1.2.csv
          (cd static_pl_source_bundle && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Build conservative outcome-blind source-completion policy
        run: |
          python build_static_pl_conservative_source_completion_v1_3.py \
            static_pl_source_bundle/STATIC_PL_SOURCE_IDENTITY_RECONCILIATION_DETAILS_v1.0.csv \
            static_pl_source_bundle/STATIC_PL_TEMPORAL_IDENTITY_DIAGNOSTIC_DETAILS_v1.2.csv \
            source_evidence/ZENNIFA_JRA_ABNORMAL_STATUS_ROWS_2005_2020_v0.1.csv \
            -o static_pl_source_bundle/STATIC_PL_CONSERVATIVE_SOURCE_COMPLETION_REPORT_v1.3.json \
            --manifest static_pl_source_bundle/STATIC_PL_CONSERVATIVE_SOURCE_ENTITY_MANIFEST_v1.3.csv
          (cd static_pl_source_bundle && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Run final fail-closed Static PL source gate
        run: |
          python static_pl_final_source_gate_v1_4.py \
            --universe static_pl_source_bundle/universe_out/STATIC_PL_EXPECTED_FLAT_UNIVERSE_REPORT_v0.2.json \
            --inventory static_pl_source_bundle/STATIC_PL_HORSESIDE_SOURCE_GAP_INVENTORY_REPORT_v0.5.json \
            --recovery static_pl_source_bundle/STATIC_PL_SOURCE_RECOVERY_DIAGNOSTIC_REPORT_v0.2.json \
            --identity static_pl_source_bundle/STATIC_PL_SOURCE_IDENTITY_RECONCILIATION_REPORT_v1.0.json \
            --temporal static_pl_source_bundle/STATIC_PL_TEMPORAL_IDENTITY_DIAGNOSTIC_REPORT_v1.2.json \
            --completion static_pl_source_bundle/STATIC_PL_CONSERVATIVE_SOURCE_COMPLETION_REPORT_v1.3.json \
            --manifest static_pl_source_bundle/STATIC_PL_CONSERVATIVE_SOURCE_ENTITY_MANIFEST_v1.3.csv \
            --canonical-ids static_pl_source_bundle/universe_out/EXPECTED_JRA_FLAT_RACE_IDS_2005_2020_STATIC_PL_v0.2.csv \
            --output static_pl_source_bundle/STATIC_PL_FINAL_SOURCE_GATE_REPORT_v1.4.json
          (cd static_pl_source_bundle && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Run frozen Static PL fit preflight without opening Tail293
        run: |
          python static_pl_fit_preflight_v1_5.py \
            --source-gate static_pl_source_bundle/STATIC_PL_FINAL_SOURCE_GATE_REPORT_v1.4.json \
            --target-input STATIC_PL_TAIL293_TARGET_INPUT_v0.1.csv \
            --canonical-races static_pl_source_bundle/universe_out/EXPECTED_JRA_FLAT_RACE_IDS_2005_2020_STATIC_PL_v0.2.csv \
            --output static_pl_source_bundle/STATIC_PL_FIT_PREFLIGHT_REPORT_v1.5.json
          cp STATIC_PL_TAIL293_TARGET_INPUT_v0.1.csv static_pl_source_bundle/
          (cd static_pl_source_bundle && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Remove raw KBlueLeaf DB
        if: always()
        shell: bash
        run: rm -f all_races_2005-2024.db

      - name: Delete large raw archive
        if: always()
        shell: bash
        run: rm -f zennifa_archive.zip

      - name: Upload source-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: static-pl-fit-preflight-v1-5-1
          path: static_pl_source_bundle/
          if-no-files-found: error
          retention-days: 30
