      - name: Run parser regression
        shell: bash
        run: |
          set -euo pipefail
          python test_extract_kblueleaf_stage0_4_safe_evidence.py

      - name: Download exact public KBlueLeaf DB once
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output all_races_2005-2024.db \
            'https://huggingface.co/datasets/KBlueLeaf/jp-racing-horse/resolve/main/all_races_2005-2024.db?download=true'
          test "$(stat -c%s all_races_2005-2024.db)" = "717680640"
          echo '7828af205838d148f6bca70870d4ab152ea6b54430093dcf3159d23583252eab  all_races_2005-2024.db' | sha256sum -c -

      - name: Export safe source evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stage0_4_out
          python extract_kblueleaf_stage0_4_safe_evidence.py \
            all_races_2005-2024.db \
            KBLUELEAF_STAGE0_4_SAFE_TARGETS_1167_v0.1.csv \
            KBLUELEAF_STAGE0_4_SAFE_SENTINEL64_v0.1.csv \
            -o stage0_4_out

      - name: Assert firewall remains closed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f stage0_4_out/KBLUELEAF_STAGE0_4_SAFE_EVIDENCE_REPORT_v0.1.json
          python - <<'PY'
          import json
          p='stage0_4_out/KBLUELEAF_STAGE0_4_SAFE_EVIDENCE_REPORT_v0.1.json'
          x=json.load(open(p,encoding='utf-8'))
          g=x.get('governance',{})
          assert g.get('predictive_metrics_read') is False
          assert g.get('form_computed') is False
          assert g.get('tail293_top1_top2_mrr_read') is False
          assert g.get('production_change')=='NONE'
          print('FIREWALL PASS')
          PY

      - name: Upload small source evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kblueleaf-stage0-v0-4-safe-source-evidence
          path: stage0_4_out/
          if-no-files-found: error
          retention-days: 30

      - name: Remove raw DB
        if: always()
        shell: bash
        run: rm -f all_races_2005-2024.db
