      - name: Pre-open governance regression v3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_PREOPEN'
          import importlib.util
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path)
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod
          sg=load('sg','final_stage1_source_gate.py')
          sc=load('sc','final_stage1_score_once.py')
          assert sg.verify_pavel_membership({sg.PAVEL_TARGET_SOURCE_RID}) is True
          for bad in [set(), {'201805010101'}, {sg.PAVEL_TARGET_SOURCE_RID,'201805010101'}]:
              try: sg.verify_pavel_membership(bad)
              except sg.Hold: pass
              else: raise AssertionError(f'Pavel bad membership accepted: {bad}')
          b=sc.BENCH_MRR
          cases=[
              ((106,193,b+1e-6),False),
              ((107,193,b+1e-6),True),
              ((106,194,b+1e-6),True),
              ((107,192,b+1e-6),False),
              ((105,194,b+1e-6),False),
              ((107,194,b),False),
          ]
          for args,expect in cases:
              got=sc.development_gate(*args)[-1]
              assert got is expect,(args,got,expect)
          print('PREOPEN_V3_REGRESSION=11/11 PASS')
          PY_PREOPEN
          python -m py_compile final_stage1_source_gate.py final_stage1_score_once.py

      - name: Download frozen Stage0.8c full949 shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stage0-8-shard-*
          path: stage0_8_artifacts
          merge-multiple: false
          repository: annihilator7777777-beep/win5-fulljra-audit
          run-id: 34445336039
          github-token: ${{ github.token }}

      - name: Verify Stage0.8c artifact geometry
        shell: bash
        run: |
          set -euo pipefail
          test "$(find stage0_8_artifacts -name 'STAGE0_8_SHARD*_REPORT.json' | wc -l)" = "4"
          test "$(find stage0_8_artifacts -name 'STAGE0_8_SHARD*_OFFICIAL_RACE_ROWS.csv' | wc -l)" = "4"
          test "$(find stage0_8_artifacts -name 'STAGE0_8_SHARD*_TARGET_PARITY.csv' | wc -l)" = "4"
          test "$(find stage0_8_artifacts -name 'STAGE0_8_SHARD*_PROFILES.csv' | wc -l)" = "4"
          test "$(find stage0_8_artifacts -name 'STAGE0_8_SHARD*_FAILURES.csv' | wc -l)" = "4"

      - name: Download exact frozen public KBlueLeaf DB
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output all_races_2005-2024.db \
            'https://huggingface.co/datasets/KBlueLeaf/jp-racing-horse/resolve/main/all_races_2005-2024.db?download=true'
          test "$(stat -c%s all_races_2005-2024.db)" = "717680640"
          echo '7828af205838d148f6bca70870d4ab152ea6b54430093dcf3159d23583252eab  all_races_2005-2024.db' | sha256sum -c -

      - name: Run post-repair source gate with predictive firewall closed
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final_stage1_out
          python final_stage1_source_gate.py \
            all_races_2005-2024.db \
            stage0_8_artifacts \
            WIN5_STAGE0_8C_FULL949_DISCREPANCY_RECONCILIATION_20260910_v0.1.csv \
            WIN5_STAGE0_8C_MATERIAL_MISSING_RECOVERY_ROWS_20260910_v0.1.json \
            WIN5_STAGE0_8C_JRA_SOURCE_ADAPTER_REPAIR_LOCK_20260910_v0.1.md \
            -o final_stage1_out
          python - <<'PY_GATE'
          import json
          p='final_stage1_out/FINAL_STAGE1_SOURCE_GATE_REPORT.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['status']=='PASS_SOURCE_GATE_POST_REPAIR'
          assert x['predictive_metrics_read'] is False
          assert x['winner_labels_read'] is False
          assert x['tail293_form_score_opened'] is False
          assert x['scoring_authorized'] is True
          print('SOURCE GATE PASS; one-time Tail293 score open authorized')
          PY_GATE

      - name: Open Tail293 FULL_JRA_FLAT_FORM v0.2 exactly once
        shell: bash
        run: |
          set -euo pipefail
          python final_stage1_score_once.py \
            WIN5_FULL_JRA_FORM_DEVELOPMENT_CANDIDATES_2016_2020_v0.1.csv \
            final_stage1_out/FINAL_STAGE1_SOURCE_GATE_REPORT.json \
            final_stage1_out/FINAL_STAGE1_CANDIDATE_SOURCE_STATUS.csv \
            final_stage1_out/FINAL_STAGE1_LATEST5_NORMALIZED.csv \
            -o final_stage1_out

      - name: Seal output hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d final_stage1_out ]; then
            find final_stage1_out -maxdepth 1 -type f ! -name SHA256SUMS_FINAL_STAGE1.txt -print0 | sort -z | xargs -0 sha256sum > final_stage1_out/SHA256SUMS_FINAL_STAGE1.txt
            cp WIN5_STAGE0_8C_JRA_SOURCE_ADAPTER_REPAIR_LOCK_20260910_v0.1.md final_stage1_out/ || true
            cp WIN5_STAGE1_STRUCTURAL_ABSTAIN_EVAL_LOCK_20260910_v0.1.md final_stage1_out/ || true
          fi

      - name: Upload final Stage1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kblueleaf-final-stage1-sourcegate-scoreonce
          path: final_stage1_out/
          if-no-files-found: error
          retention-days: 30

      - name: Remove raw DB
        if: always()
        shell: bash
        run: rm -f all_races_2005-2024.db
