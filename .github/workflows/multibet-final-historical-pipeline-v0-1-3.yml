          echo '9daa3a907ff3cf7b2659040fea96e2e0c2b6c5611fc756960cb1733c35506ed3  multibet_development_temporal_stability_v0_1.py' | sha256sum -c -

      - name: Install numerical dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q numpy pandas scipy

      - name: Download exact frozen DB
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30             -o all_races_2005-2024.db             'https://huggingface.co/datasets/KBlueLeaf/jp-racing-horse/resolve/main/all_races_2005-2024.db?download=true'
          test "$(stat -c%s all_races_2005-2024.db)" = '717680640'
          echo '7828af205838d148f6bca70870d4ab152ea6b54430093dcf3159d23583252eab  all_races_2005-2024.db' | sha256sum -c -

      - name: Build source-safe ledger and frozen target cohort
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final_pipeline
          mkdir -p final_pipeline/source final_pipeline/state final_pipeline/features final_pipeline/eval
          python source_safe_ledger_builder_v0_1.py             --db all_races_2005-2024.db             --outdir final_pipeline/source             | tee final_pipeline/source_builder_stdout.json

      - name: Build strict-prior target states
        shell: bash
        run: |
          set -euo pipefail
          python multibet_strict_prior_state_builder_v0_1.py             --targets final_pipeline/source/targets.csv             --resolved-ledger final_pipeline/source/resolved_ledger.csv             --output-safe-runs final_pipeline/state/safe_runs.csv             --provenance final_pipeline/state/state_provenance.json

      - name: Assemble frozen features
        shell: bash
        run: |
          set -euo pipefail
          python multibet_feature_assembler_v0_1.py             --targets final_pipeline/source/targets.csv             --safe-runs final_pipeline/state/safe_runs.csv             --output-csv final_pipeline/features/features.csv             --provenance final_pipeline/features/feature_provenance.json
          sha256sum final_pipeline/features/features.csv | tee final_pipeline/features/features.sha256

      - name: Open DEVELOPMENT outcomes only
        shell: bash
        run: |
          set -euo pipefail
          python outcome_extractor_v0_1.py             --db all_races_2005-2024.db             --race-manifest final_pipeline/source/source_race_manifest.csv             --start-year 2016 --end-year 2020             --output final_pipeline/eval/development_outcomes.csv             | tee final_pipeline/eval/development_outcome_extract.json

      - name: Upload pre-validation checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: multibet-prevalidation-checkpoint-v0-1-3
          path: |
            final_pipeline/source/SOURCE_SAFE_LEDGER_REPORT.json
            final_pipeline/source/source_race_manifest.csv
            final_pipeline/source/validation_full_flat_ids_2021_2024.txt
            final_pipeline/state/state_provenance.json
            final_pipeline/features/features.csv
            final_pipeline/features/feature_provenance.json
            final_pipeline/features/features.sha256
            final_pipeline/eval/development_outcomes.csv
            final_pipeline/eval/development_outcome_extract.json
          if-no-files-found: error
          retention-days: 30

      - name: Run frozen development rolling-origin falsification
        shell: bash
        run: |
          set -euo pipefail
          cp multibet_serial_gate_evaluator_v0_1.py final_pipeline/eval/
          cp multibet_development_temporal_stability_v0_1.py final_pipeline/eval/
          python final_pipeline/eval/multibet_development_temporal_stability_v0_1.py             --features final_pipeline/features/features.csv             --development-outcomes final_pipeline/eval/development_outcomes.csv             --output final_pipeline/eval/development_temporal_stability.json             > final_pipeline/eval/development_temporal_stability_stdout.json

      - name: Freeze gate before validation outcomes exist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('final_pipeline/features/features.csv')
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          dev=json.load(open('final_pipeline/eval/development_temporal_stability.json'))
          key='D_NLL_VALUE_M2_MINUS_M1'
          falsified=bool(dev['prequential_2018_2020'][key]['development_falsified'])
          gate={
            'schema':'MULTIBET_HISTORICAL_VALIDATION_GATE_20260928_FINAL_v0.1',
            'pinned_db_sha256':'7828af205838d148f6bca70870d4ab152ea6b54430093dcf3159d23583252eab',
            'feature_file_sha256':h,
            'validation_universe_2021_2024_exact_manifest':'PASS',
            'form_asof_adjudication_gate':'PASS',
            'real_db_v0_4_stage_a':'PASS',
            'historical_validation_open_authorized':not falsified,
            'source_gate_meanings':{
              'validation_universe':'PASS_SOURCE_BOUND_EXACT_13316_MANIFEST_CARDINALITY_RECONCILED',
              'form_asof':'PASS_CONSERVATIVE_MECHANICAL_EXCLUSION',
              'stage_a':'PASS_CORRECTED_DUAL_TABLE_SOURCE_INTEGRITY'
            },
            'development_speed_value_falsified':falsified,
            'validation_outcomes_created_at_gate_time':False,
            'architecture_change_after_validation_prohibited':True
          }
          pathlib.Path('final_pipeline/eval/historical_validation_gate.json').write_text(
              json.dumps(gate,indent=2,sort_keys=True)+'\n')
          pathlib.Path('final_pipeline/eval/OPEN_VALIDATION').write_text('1\n' if not falsified else '0\n')
          print(json.dumps(gate,indent=2))
          PY

      - name: Conditionally open untouched validation once and score
        shell: bash
        run: |
          set -euo pipefail
          OPEN="$(tr -d '\n\r ' < final_pipeline/eval/OPEN_VALIDATION)"
          if [ "$OPEN" = "1" ]; then
            python outcome_extractor_v0_1.py               --db all_races_2005-2024.db               --race-manifest final_pipeline/source/source_race_manifest.csv               --start-year 2021 --end-year 2024               --output final_pipeline/eval/validation_outcomes.csv               | tee final_pipeline/eval/validation_outcome_extract.json
            python multibet_serial_gate_evaluator_v0_1.py               --features final_pipeline/features/features.csv               --development-outcomes final_pipeline/eval/development_outcomes.csv               --validation-outcomes final_pipeline/eval/validation_outcomes.csv               --gate final_pipeline/eval/historical_validation_gate.json               --output final_pipeline/eval/serial_evaluator_result.json               > final_pipeline/eval/serial_evaluator_stdout.json
          else
            python multibet_serial_gate_evaluator_v0_1.py               --features final_pipeline/features/features.csv               --development-outcomes final_pipeline/eval/development_outcomes.csv               --gate final_pipeline/eval/historical_validation_gate.json               --output final_pipeline/eval/serial_evaluator_result.json               > final_pipeline/eval/serial_evaluator_stdout.json
          fi
          rm -f final_pipeline/eval/validation_outcomes.csv

      - name: Build compact final summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          src=json.load(open('final_pipeline/source/SOURCE_SAFE_LEDGER_REPORT.json'))
          dev=json.load(open('final_pipeline/eval/development_temporal_stability.json'))
          gate=json.load(open('final_pipeline/eval/historical_validation_gate.json'))
          ev=json.load(open('final_pipeline/eval/serial_evaluator_result.json'))
          summary={
            'status':'PASS_FINAL_HISTORICAL_PIPELINE_RUN_COMPLETE',
            'source':src,
            'development_primary_speed_value':dev['prequential_2018_2020']['D_NLL_VALUE_M2_MINUS_M1'],
            'gate':gate,
            'serial_evaluator_status':ev.get('status'),
            'validation_outcomes_opened':ev.get('validation_outcomes_opened',False),
            'serial_promotion':ev.get('serial_promotion'),
            'model_validation_summary':ev.get('model_validation_summary'),
            'comparisons':ev.get('comparisons'),
            'action_boundary':ev.get('action_boundary'),
            'financial_success':'NOT_YET'
          }
          pathlib.Path('final_pipeline/FINAL_PIPELINE_SUMMARY.json').write_text(
              json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({
            'status':summary['status'],
            'serial_evaluator_status':summary['serial_evaluator_status'],
            'validation_outcomes_opened':summary['validation_outcomes_opened'],
            'selected':(summary.get('serial_promotion') or {}).get('SELECTED_PREDICTIVE_MODEL'),
            'financial_success':'NOT_YET'
          },indent=2))
          PY

      - name: Remove large transient and raw outcome files
        shell: bash
        run: |
          set -euo pipefail
          rm -f final_pipeline/source/resolved_ledger.csv
          rm -f final_pipeline/state/safe_runs.csv
          rm -f final_pipeline/eval/development_outcomes.csv
          rm -f final_pipeline/eval/validation_outcomes.csv

      - name: Upload final historical artifact
        uses: actions/upload-artifact@v4
        with:
          name: multibet-final-historical-pipeline-v0-1-3
          path: |
            final_pipeline/FINAL_PIPELINE_SUMMARY.json
            final_pipeline/source/SOURCE_SAFE_LEDGER_REPORT.json
            final_pipeline/source/source_race_manifest.csv
            final_pipeline/source/validation_full_flat_ids_2021_2024.txt
            final_pipeline/state/state_provenance.json
            final_pipeline/features/feature_provenance.json
            final_pipeline/features/features.sha256
            final_pipeline/eval/development_temporal_stability.json
            final_pipeline/eval/historical_validation_gate.json
            final_pipeline/eval/serial_evaluator_result.json
            final_pipeline/eval/development_outcome_extract.json
            final_pipeline/eval/validation_outcome_extract.json
          if-no-files-found: warn
          retention-days: 30
