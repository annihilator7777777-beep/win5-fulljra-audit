      - name: Run Stage0.6 regression
        shell: bash
        run: |
          set -euo pipefail
          python test_extract_jra_stage0_6_external64_parity_v0_1.py

      - name: Acquire fixed 64 official profiles and compare prior race IDs
        id: acquire
        shell: bash
        run: |
          set +e
          rm -rf stage0_6_out
          python extract_jra_stage0_6_external64_parity_v0_1.py \
            KBLUELEAF_EXTERNAL_COMPLETENESS_SENTINEL_64_NAMED_v0.1.csv \
            KBLUELEAF_EXTERNAL64_MEMBERSHIP_ID_ONLY_v0.1.csv \
            -o stage0_6_out \
            --delay-seconds 2.0 \
            --timeout-seconds 30
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assert predictive firewall remains closed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f stage0_6_out/KBLUELEAF_STAGE0_6_EXTERNAL64_REPORT_v0.1.json
          python - <<'PY2'
          import json
          p='stage0_6_out/KBLUELEAF_STAGE0_6_EXTERNAL64_REPORT_v0.1.json'
          x=json.load(open(p,encoding='utf-8'))
          g=x.get('governance',{})
          assert g.get('production_change')=='NONE'
          assert g.get('target_winner_flag_read') is False
          assert g.get('tail293_form_computed') is False
          assert g.get('tail293_top1_top2_mrr_read') is False
          assert g.get('predictive_metrics_read') is False
          assert g.get('tail293_scoring_authorized') is False
          print('FIREWALL PASS')
          PY2

      - name: Attach frozen lock
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp WIN5_KBLUELEAF_STAGE0_6_EXTERNAL64_LOCK_20260910_v0.1.md stage0_6_out/
          (cd stage0_6_out && sha256sum * > SHA256SUMS_STAGE0_6_WITH_LOCK.txt)

      - name: Upload small Stage0.6 evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kblueleaf-stage0-v0-6-external64-official-parity
          path: stage0_6_out/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Final Stage0.6 gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.acquire.outputs.rc }}" = "0"
          python - <<'PY3'
          import json
          x=json.load(open('stage0_6_out/KBLUELEAF_STAGE0_6_EXTERNAL64_REPORT_v0.1.json',encoding='utf-8'))
          assert x.get('status')=='PASS_KBLUELEAF_EXTERNAL64_OFFICIAL_PRIOR_RACE_ID_PARITY', x
          s=x.get('scope',{})
          assert s.get('sentinel_horses')==64
          assert s.get('resolved_profiles')==64
          assert s.get('failed_profiles')==0
          assert s.get('parity_rows')==64
          assert s.get('parity_pass_horses')==64
          print('STAGE0.6 PASS: fixed 64/64 exact strictly-prior race-ID parity')
          PY3
