      - name: Run Stage0.7 regression
        shell: bash
        run: |
          set -euo pipefail
          python test_screen_kblueleaf_1990_2025_source_v0_1.py

      - name: Download exact public newer KBlueLeaf DB
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output all_races_1990-2025.db \
            'https://huggingface.co/datasets/KBlueLeaf/jp-racing-horse/resolve/main/all_races_1990-2025.db?download=true'
          echo '7c6717f6f081f957721396d1e0e7296b4be3eeaa2fe1a657b41a4b5358474be9  all_races_1990-2025.db' | sha256sum -c -

      - name: Screen newer DB without predictive scoring
        shell: bash
        run: |
          set +e
          python screen_kblueleaf_1990_2025_source_v0_1.py \
            all_races_1990-2025.db \
            EXPECTED_JRA_FLAT_RACE_IDS_2016_2020_CANONICAL_v0.1.csv \
            JRA_OFFICIAL_EXTERNAL64_RACE_DATE_ROWS_v0.1.csv \
            KBLUELEAF_STAGE0_6B_DISCREPANCY_STATUS_MANIFEST_v0.1.csv \
            -o KBLUELEAF_STAGE0_7_NEWER_DB_SCREEN_REPORT_v0.1.json \
            --evidence KBLUELEAF_STAGE0_7_NEWER_DB_EXTERNAL64_EVIDENCE_v0.1.csv
          code=$?
          echo "$code" > SCREEN_EXIT_CODE.txt
          exit 0

      - name: Assert predictive firewall remains closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('KBLUELEAF_STAGE0_7_NEWER_DB_SCREEN_REPORT_v0.1.json'))
          g=r['governance']
          assert g['tail293_form_computed'] is False
          assert g['tail293_top1_top2_mrr_read'] is False
          assert g['target_winner_flag_read'] is False
          assert g['production_change']=='NONE'
          assert g['formal_source_acceptance'] is False
          print('predictive firewall PASS')
          PY

      - name: Remove raw DB and seal checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -f all_races_1990-2025.db
          sha256sum \
            KBLUELEAF_STAGE0_7_NEWER_DB_SCREEN_REPORT_v0.1.json \
            KBLUELEAF_STAGE0_7_NEWER_DB_EXTERNAL64_EVIDENCE_v0.1.csv \
            SCREEN_EXIT_CODE.txt > SHA256SUMS_STAGE0_7.txt

      - name: Upload small Stage0.7 evidence only
        uses: actions/upload-artifact@v4
        with:
          name: kblueleaf-stage0-v0-7-newer-db-source-screen
          path: |
            KBLUELEAF_STAGE0_7_NEWER_DB_SCREEN_REPORT_v0.1.json
            KBLUELEAF_STAGE0_7_NEWER_DB_EXTERNAL64_EVIDENCE_v0.1.csv
            SCREEN_EXIT_CODE.txt
            SHA256SUMS_STAGE0_7.txt
          retention-days: 30

      - name: Final Stage0.7 screen gate
        shell: bash
        run: |
          set -euo pipefail
          code="$(cat SCREEN_EXIT_CODE.txt)"
          if [ "$code" != "0" ]; then
            echo "Stage0.7 newer DB screen did not pass; source remains HOLD."
            exit "$code"
          fi
          echo "Stage0.7 newer DB screen PASS; full source gate still required before Tail293."
