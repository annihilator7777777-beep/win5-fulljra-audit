      - name: Run Stage0.6b regression
        shell: bash
        run: |
          set -euo pipefail
          python -W error::ResourceWarning -m unittest -v test_reconcile_kblueleaf_stage0_6b_discrepancies_v0_1.py

      - name: Download exact public KBlueLeaf DB
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output all_races_2005-2024.db \
            'https://huggingface.co/datasets/KBlueLeaf/jp-racing-horse/resolve/main/all_races_2005-2024.db?download=true'
          test "$(stat -c%s all_races_2005-2024.db)" = "717680640"
          echo '7828af205838d148f6bca70870d4ab152ea6b54430093dcf3159d23583252eab  all_races_2005-2024.db' | sha256sum -c -

      - name: Reconcile eight frozen discrepancies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage0_6b_out
          set +e
          python reconcile_kblueleaf_stage0_6b_discrepancies_v0_1.py \
            all_races_2005-2024.db \
            KBLUELEAF_STAGE0_6B_DISCREPANCY_STATUS_MANIFEST_v0.1.csv \
            -o stage0_6b_out
          rc=$?
          set -e
          printf '%s\n' "$rc" > stage0_6b_out/RECONCILIATION_EXIT_CODE.txt
          cp KBLUELEAF_STAGE0_6B_DISCREPANCY_STATUS_MANIFEST_v0.1.csv stage0_6b_out/
          cp WIN5_KBLUELEAF_STAGE0_6_STATUS_SEMANTICS_ERRATUM_20260910_v0.1.md stage0_6b_out/

      - name: Assert predictive firewall remains closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='stage0_6b_out/KBLUELEAF_STAGE0_6B_DISCREPANCY_REPORT_v0.1.json'
          x=json.load(open(p,encoding='utf-8'))
          g=x.get('governance',{})
          assert g.get('predictive_metrics_read') is False
          assert g.get('tail293_form_computed') is False
          assert g.get('tail293_top1_top2_mrr_read') is False
          assert g.get('target_winner_flag_read') is False
          assert g.get('tail293_scoring_authorized') is False
          assert g.get('production_change')=='NONE'
          print(x.get('status'))
          PY

      - name: Seal Stage0.6b checksums and remove raw DB
        shell: bash
        run: |
          set -euo pipefail
          (
            cd stage0_6b_out
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS_STAGE0_6B_WITH_LOCK.txt' -printf '%f\n' \
              | LC_ALL=C sort \
              | xargs sha256sum \
              > SHA256SUMS_STAGE0_6B_WITH_LOCK.txt
          )
          rm -f all_races_2005-2024.db

      - name: Upload small Stage0.6b evidence only
        uses: actions/upload-artifact@v4
        with:
          name: kblueleaf-stage0-v0-6b-discrepancy-source-reconciliation
          path: stage0_6b_out/
          retention-days: 30

      - name: Final Stage0.6b gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('stage0_6b_out/KBLUELEAF_STAGE0_6B_DISCREPANCY_REPORT_v0.1.json',encoding='utf-8'))
          if x.get('status')!='PASS_KBLUELEAF_STAGE0_6B_DISCREPANCY_RECONCILIATION':
              raise SystemExit('HOLD: '+str(x.get('status'))+' '+str(x.get('reason','')))
          e=x.get('eligible_discrepancy',{})
          assert e.get('horse_id')=='2015102980'
          assert e.get('race_id')=='201710020401'
          assert e.get('race_side_recoverable') is True
          assert int(e.get('race_subject_finish'))==2
          assert int(e.get('race_subject_horse_number'))==12
          assert int(e.get('race_collection_count'))==13
          assert int(e.get('peer_field_consensus'))==13
          print('PASS_STAGE0_6B_SOURCE_ADAPTER_RECOVERY_CANDIDATE_ONLY')
          PY
