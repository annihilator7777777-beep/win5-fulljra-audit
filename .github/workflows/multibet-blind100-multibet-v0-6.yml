      - name: Download frozen prevalidation checkpoint
        uses: actions/download-artifact@v4
        with:
          name: multibet-prevalidation-checkpoint-v0-1-3
          path: checkpoint
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36353259533

      - name: Verify frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          echo 'b4fafafa90d00559d9840224530d6d1ad958f5bff82be1447307ef3bc8bb8938  checkpoint/features/features.csv' | sha256sum -c -
          echo '296825170854f37e079205a1a69fa34876b031f98a057e6952a6a23d6c17cadb  checkpoint/eval/development_outcomes.csv' | sha256sum -c -

      - name: Install dependencies
        run: python -m pip install -q numpy pandas scipy 'kagglehub==1.0.2'

      - name: Seal 100 blind predictions before market/result ingest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p blind100/seal blind100/score
          python blind100_eval_v06.py seal \
            --features checkpoint/features/features.csv \
            --outcomes checkpoint/eval/development_outcomes.csv \
            --outdir blind100/seal | tee blind100/seal/seal_stdout.json
          sha256sum blind100/seal/prediction_seal.json blind100/seal/predictions.csv

      - name: Download Kaggle result and payoff archive only after seal
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          import kagglehub
          from pathlib import Path
          p=kagglehub.dataset_download('takamotoki/jra-horse-racing-dataset')
          Path('kaggle_path.txt').write_text(str(p))
          print(p)
          PY2
          KDIR="$(cat kaggle_path.txt)"
          RR="$(find "$KDIR" -type f -name '19860105-20210731_race_result.csv' | head -1)"
          OD="$(find "$KDIR" -type f -name '19860105-20210731_odds.csv' | head -1)"
          test -n "$RR" && test -f "$RR"
          test -n "$OD" && test -f "$OD"
          printf '%s\n' "$RR" > race_result_path.txt
          printf '%s\n' "$OD" > odds_path.txt

      - name: Score fixed ticket families
        shell: bash
        run: |
          set -euo pipefail
          python blind100_eval_v06.py score \
            --seal-dir blind100/seal \
            --race-result "$(cat race_result_path.txt)" \
            --odds "$(cat odds_path.txt)" \
            --outdir blind100/score | tee blind100/score/score_stdout.json

      - name: Upload blind100 artifact
        uses: actions/upload-artifact@v4
        with:
          name: multibet-blind100-multibet-v0-6
          path: |
            blind100/seal/prediction_seal.json
            blind100/seal/prediction_seal.sha256
            blind100/seal/predictions.csv
            blind100/seal/seal_stdout.json
            blind100/score/score_summary.json
            blind100/score/strategy_summary.csv
            blind100/score/race_detail.jsonl
            blind100/score/ticket_ledger.csv
            blind100/score/score_stdout.json
          if-no-files-found: error
          retention-days: 30
