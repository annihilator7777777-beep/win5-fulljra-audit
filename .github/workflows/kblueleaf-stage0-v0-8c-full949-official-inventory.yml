      - name: Run Stage0.8 regression
        shell: bash
        run: |
          set -euo pipefail
          python test_extract_jra_stage0_8_full949_inventory_v0_1.py

      - name: Acquire official profiles for shard and inventory parity
        shell: bash
        run: |
          set +e
          mkdir -p "stage0_8_shard_${{ matrix.shard_index }}"
          python extract_jra_stage0_8_full949_inventory_v0_1.py \
            KBLUELEAF_TARGET949_SAFE_TARGETS_NAMED_v0.1.csv \
            KBLUELEAF_TARGET949_JRA_MEMBERSHIP_ID_ONLY_v0.1.csv \
            -o "stage0_8_shard_${{ matrix.shard_index }}" \
            --shard-index "${{ matrix.shard_index }}" --shard-count 4 \
            --delay-seconds 2.0 --timeout-seconds 30
          code=$?
          echo "$code" > "stage0_8_shard_${{ matrix.shard_index }}/EXTRACT_EXIT_CODE.txt"
          exit 0

      - name: Assert predictive firewall remains closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          s="${{ matrix.shard_index }}"
          p=pathlib.Path(f"stage0_8_shard_{s}/STAGE0_8_SHARD{s}_REPORT.json")
          r=json.loads(p.read_text())
          g=r["governance"]
          assert g["target_winner_flag_read"] is False
          assert g["tail293_form_computed"] is False
          assert g["tail293_top1_top2_mrr_read"] is False
          assert g["predictive_metrics_read"] is False
          assert g["tail293_scoring_authorized"] is False
          assert g["production_change"]=="NONE"
          print("predictive firewall PASS")
          PY

      - name: Seal shard checksums
        shell: bash
        run: |
          set -euo pipefail
          s="${{ matrix.shard_index }}"
          (cd "stage0_8_shard_$s" && sha256sum * > SHA256SUMS_STAGE0_8_SHARD.txt)

      - name: Upload Stage0.8 shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage0-8-shard-${{ matrix.shard_index }}
          path: stage0_8_shard_${{ matrix.shard_index }}/
          retention-days: 30

      - name: Final shard acquisition gate
        shell: bash
        run: |
          set -euo pipefail
          code="$(cat stage0_8_shard_${{ matrix.shard_index }}/EXTRACT_EXIT_CODE.txt)"
          if [ "$code" != "0" ]; then
            echo "Stage0.8 shard acquisition HOLD"
            exit "$code"
          fi
          echo "Stage0.8 shard acquisition PASS"

