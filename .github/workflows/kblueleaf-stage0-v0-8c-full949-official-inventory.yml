      - name: Aggregate full949 official inventory
        shell: bash
        run: |
          set +e
          mkdir -p stage0_8_out
          python aggregate_jra_stage0_8_full949_inventory_v0_1.py stage0_8_download -o stage0_8_out
          code=$?
          echo "$code" > stage0_8_out/AGGREGATE_EXIT_CODE.txt
          cp WIN5_KBLUELEAF_STAGE0_8_FULL949_REMEDIATION_LOCK_20260910_v0.1.md stage0_8_out/
          exit 0

      - name: Seal aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd stage0_8_out && sha256sum * > SHA256SUMS_STAGE0_8_FINAL.txt)

      - name: Upload Stage0.8 aggregate evidence
        uses: actions/upload-artifact@v4
        with:
          name: kblueleaf-stage0-v0-8-full949-official-inventory
          path: stage0_8_out/
          retention-days: 30

      - name: Final Stage0.8 inventory gate
        shell: bash
        run: |
          set -euo pipefail
          code="$(cat stage0_8_out/AGGREGATE_EXIT_CODE.txt)"
          if [ "$code" != "0" ]; then
            echo "Stage0.8 full949 inventory incomplete; source remains HOLD."
            exit "$code"
          fi
          python - <<'PY'
          import json
          r=json.load(open("stage0_8_out/KBLUELEAF_STAGE0_8_FULL949_OFFICIAL_INVENTORY_REPORT_v0.1.json"))
          assert r["status"]=="PASS_FULL949_OFFICIAL_INVENTORY"
          assert r["governance"]["tail293_scoring_authorized"] is False
          print("Stage0.8 full949 official inventory PASS; source remains HOLD pending discrepancy reconciliation if any.")
          PY
