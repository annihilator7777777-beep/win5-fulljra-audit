      - name: Open Static PL Tail293 once and apply frozen Development gate
        shell: bash
        run: |
          set -euo pipefail
          python static_pl_open_and_score_v1_6.py \
            --pred static_pl_one_shot/STATIC_PL_TAIL293_PREDICTIONS_SEALED_v0.1.csv \
            --seal static_pl_one_shot/STATIC_PL_TAIL293_PREDICTION_SEAL_v0.1.json \
            --labels STATIC_PL_TAIL293_LABELS_FULL.csv \
            --out-dir static_pl_one_shot
          rm -f STATIC_PL_TAIL293_LABELS_FULL.csv
          (cd static_pl_one_shot && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Remove raw KBlueLeaf DB
        if: always()
        shell: bash
        run: rm -f all_races_2005-2024.db

      - name: Delete large raw archive
        if: always()
        shell: bash
        run: rm -f zennifa_archive.zip

      - name: Upload source-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: static-pl-tail293-one-shot-open-v1-6-1
          path: static_pl_source_bundle/
          if-no-files-found: error
          retention-days: 30
