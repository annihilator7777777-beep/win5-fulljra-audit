      - name: Download exact frozen KBlueLeaf DB
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 -o all_races_2005-2024.db 'https://huggingface.co/datasets/KBlueLeaf/jp-racing-horse/resolve/main/all_races_2005-2024.db?download=true'
          test "$(stat -c%s all_races_2005-2024.db)" = '717680640'
          echo '7828af205838d148f6bca70870d4ab152ea6b54430093dcf3159d23583252eab  all_races_2005-2024.db' | sha256sum -c -

      - name: Run corrected exhaustive integrity inventory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf corrected_stagea_integrity
          python inventory_fulljra_speed_stagea_source_gaps_v0_2.py --db all_races_2005-2024.db --expected-flat EXPECTED_JRA_FLAT_RACE_IDS_2016_2020_CANONICAL_v0.1.csv --outdir corrected_stagea_integrity | tee corrected_stagea_stdout.json
          python - <<'PY'
          import csv,json,pathlib,collections,hashlib
          d=pathlib.Path('corrected_stagea_integrity')
          report=json.loads((d/'FULLJRA_SPEED_STAGEA_SOURCE_GAP_REPORT_v0.1.json').read_text())
          rows=list(csv.DictReader((d/'FULLJRA_SPEED_STAGEA_SOURCE_GAP_INVENTORY_v0.1.csv').open()))
          assert report['races']==16639
          assert report['expected_flat_sha256']=='0040468145d620c6ffa06027fb9ec9926495b0817eb6d7ad22e9a9e9e10eaf02'
          assert report['predictive_metrics_read'] is False
          assert report['winner_labels_used'] is False
          assert report['odds_popularity_payout_read'] is False
          assert report['posthoc_threshold_selected'] is False
          totals=collections.Counter()
          for r in rows:
              for k in ['race_members','horse_members','union_members','race_only_runners','horse_only_runners',
                        'elapsed_both_match','elapsed_both_disagree','elapsed_race_only','elapsed_horse_only','elapsed_both_missing']:
                  totals[k]+=int(r[k] or 0)
          summary={
            'status':'PASS_CORRECTED_STAGEA_EXHAUSTIVE_RUN_COMPLETE',
            'closure_status':'REVIEW_REQUIRED_NOT_AUTO_CLOSED',
            'races':len(rows),
            'flagged_races':report['flagged_races'],
            'flag_counts':report['flag_counts'],
            'totals':dict(totals),
            'schema_frozen':{'horse_row_min_len':16,'race_id':0,'field_size':7,'ranking_status':12,'elapsed':13,'final600':15},
            'horse_date_inferred':False,
            'race_context_authority':'Race table; Horse cross-check only place/course/distance/going',
            'predictive_metrics_read':False,'winner_labels_used':False,'odds_popularity_payout_read':False,
            'posthoc_threshold_selected':False
          }
          (d/'CORRECTED_STAGEA_EXHAUSTIVE_SUMMARY_v0.2.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload exhaustive integrity artifact
        uses: actions/upload-artifact@v4
        with:
          name: multibet-fulljra-corrected-stagea-exhaustive-integrity-v0-2
          path: |
            corrected_stagea_integrity/
            corrected_stagea_stdout.json
          if-no-files-found: error
          retention-days: 30
