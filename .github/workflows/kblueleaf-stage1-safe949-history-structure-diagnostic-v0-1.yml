      - name: Download exact frozen KBlueLeaf DB
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output all_races_2005-2024.db \
            'https://huggingface.co/datasets/KBlueLeaf/jp-racing-horse/resolve/main/all_races_2005-2024.db?download=true'
          test "$(stat -c%s all_races_2005-2024.db)" = "717680640"
          echo '7828af205838d148f6bca70870d4ab152ea6b54430093dcf3159d23583252eab  all_races_2005-2024.db' | sha256sum -c -

      - name: Scan SAFE949 horse-history structure only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p history_diag_out
          python - <<'PY'
          import csv,json,re,sqlite3,hashlib
          from collections import Counter
          from pathlib import Path

          SAFE='WIN5_FULL_JRA_FORM_SAFE949_HORSE_IDS_20260911_v0.1.csv'
          DB='all_races_2005-2024.db'
          VENUES={f'{i:02d}' for i in range(1,11)}

          def is_jra_rid(x):
              s=str(x)
              return bool(re.fullmatch(r'\d{12}',s)) and s[4:6] in VENUES

          ids=list(csv.DictReader(open(SAFE,encoding='utf-8-sig')))
          con=sqlite3.connect(DB)
          anomalies=[]
          horse_summary=[]
          for r in ids:
              hid=r['horse_id']; hname=r['horse_name']
              q=con.execute('select name,races from horse where cast(hid as text)=?',(hid,)).fetchall()
              if len(q)!=1:
                  anomalies.append({
                      'horse_id':hid,'horse_name':hname,'item_index':'',
                      'anomaly':'HORSE_ROW_COUNT','item_type':'','item_len':'',
                      'first_value':'','repr':repr(len(q))[:300]
                  })
                  horse_summary.append({'horse_id':hid,'horse_name':hname,'db_name':'','n_items':'',
                                        'malformed_items':1,'short_jra_items':'','jra_items':'','nonjra_list_items':''})
                  continue
              db_name,raw=q[0]
              try:
                  outer=json.loads(raw)
              except Exception as e:
                  anomalies.append({
                      'horse_id':hid,'horse_name':hname,'item_index':'',
                      'anomaly':'INVALID_JSON','item_type':type(raw).__name__,'item_len':'',
                      'first_value':'','repr':repr(str(e))[:300]
                  })
                  horse_summary.append({'horse_id':hid,'horse_name':hname,'db_name':db_name or '','n_items':'',
                                        'malformed_items':1,'short_jra_items':'','jra_items':'','nonjra_list_items':''})
                  continue
              if not isinstance(outer,list) or not outer or not isinstance(outer[0],list):
                  anomalies.append({
                      'horse_id':hid,'horse_name':hname,'item_index':'',
                      'anomaly':'OUTER_SHAPE','item_type':type(outer).__name__,'item_len':len(outer) if hasattr(outer,'__len__') else '',
                      'first_value':'','repr':repr(outer)[:300]
                  })
                  horse_summary.append({'horse_id':hid,'horse_name':hname,'db_name':db_name or '','n_items':'',
                                        'malformed_items':1,'short_jra_items':'','jra_items':'','nonjra_list_items':''})
                  continue

              rows=outer[0]
              malformed=shortj=jra=nonj=0
              for i,h in enumerate(rows):
                  if not isinstance(h,list) or not h:
                      malformed += 1
                      anomalies.append({
                          'horse_id':hid,'horse_name':hname,'item_index':i,
                          'anomaly':'MALFORMED_HISTORY_ITEM','item_type':type(h).__name__,
                          'item_len':len(h) if hasattr(h,'__len__') else '',
                          'first_value':'','repr':repr(h)[:300]
                      })
                      continue
                  rid=str(h[0])
                  if is_jra_rid(rid):
                      jra += 1
                      if len(h)<18:
                          shortj += 1
                          anomalies.append({
                              'horse_id':hid,'horse_name':hname,'item_index':i,
                              'anomaly':'SHORT_JRA_HISTORY','item_type':'list','item_len':len(h),
                              'first_value':rid,'repr':repr(h)[:300]
                          })
                  else:
                      nonj += 1
              horse_summary.append({
                  'horse_id':hid,'horse_name':hname,'db_name':db_name or '',
                  'n_items':len(rows),'malformed_items':malformed,'short_jra_items':shortj,
                  'jra_items':jra,'nonjra_list_items':nonj
              })

          fields=['horse_id','horse_name','item_index','anomaly','item_type','item_len','first_value','repr']
          with open('history_diag_out/SAFE949_HISTORY_ANOMALIES.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(anomalies)
          sf=['horse_id','horse_name','db_name','n_items','malformed_items','short_jra_items','jra_items','nonjra_list_items']
          with open('history_diag_out/SAFE949_HISTORY_SUMMARY.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=sf); w.writeheader(); w.writerows(horse_summary)

          counts=Counter(x['anomaly'] for x in anomalies)
          report={
              'status':'DIAGNOSTIC_ONLY',
              'safe949_sha256':'dfe8f8b7f3100ede3988364003cb4d2cc913c2ec50be13607cde6ec8e7620c3d',
              'n_safe_horses':len(ids),
              'n_anomaly_rows':len(anomalies),
              'anomaly_counts':dict(counts),
              'target_horse_2011106076':[x for x in anomalies if x['horse_id']=='2011106076'],
              'governance':{
                  'winner_labels_read':False,
                  'predictive_metrics_read':False,
                  'tail293_form_score_opened':False,
                  'scoring_authorized':False,
                  'production_change':'NONE'
              }
          }
          Path('history_diag_out/SAFE949_HISTORY_STRUCTURE_REPORT.json').write_text(
              json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Seal diagnostic hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d history_diag_out ]; then
            find history_diag_out -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > history_diag_out/SHA256SUMS.txt
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kblueleaf-stage1-safe949-history-structure-diagnostic
          path: history_diag_out/
          if-no-files-found: error
          retention-days: 30

      - name: Remove raw DB
        if: always()
        shell: bash
        run: rm -f all_races_2005-2024.db
