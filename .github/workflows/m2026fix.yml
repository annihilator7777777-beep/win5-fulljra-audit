name: MULTIBET racedata 2026-current runner parity v0.2.1 source-reconciliation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/m2026fix.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned racedata source
        uses: actions/checkout@v6
        with:
          repository: leostudiono1/racedata
          ref: 496bd254f96f0a370616d350f862153f2f5cece0
          path: racedata
          fetch-depth: 1

      - name: Verify pinned source commit
        shell: bash
        run: |
          test "$(git -C racedata rev-parse HEAD)" = "496bd254f96f0a370616d350f862153f2f5cece0"

      - name: Materialize source-reconciliation auditor v0.2.1 candidate
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > multibet_racedata_full_runner_parity_audit_v0_2_1_candidate.py
          test "$(sha256sum multibet_racedata_full_runner_parity_audit_v0_2_1_candidate.py | awk '{print $1}')" = "d9e6b2bcd1d4e939908c295c764a14dea8ab4b1fb3297b6df1416cf32072ca57"
          python -m py_compile multibet_racedata_full_runner_parity_audit_v0_2_1_candidate.py

      - name: Run full 2026-current fail-closed gate
        id: audit2026
        continue-on-error: true
        run: |
          python multibet_racedata_full_runner_parity_audit_v0_2_1_candidate.py \
            --jra-root racedata/data/archive/2026 \
            --netkeiba-root racedata/data/netkeiba/races/2026 \
            --year 2026 \
            --expected-final-races 2610 \
            --report RACEDATA_FULL_2026_CURRENT_RUNNER_PARITY_V021.json \
            --ledger PORTABLE_BT_LEDGER_2026_CURRENT_V021.csv

      - name: Seal provenance and hashes
        if: always()
        shell: bash
        run: |
          cat > RACEDATA_FULL_2026_CURRENT_PROVENANCE_V021.txt <<'EOF'
          source_repository=leostudiono1/racedata
          source_commit=496bd254f96f0a370616d350f862153f2f5cece0
          auditor=MULTIBET_RACEDATA_FULL_RUNNER_PARITY_AUDIT_20260929_v0.2.1_SOURCE_RECONCILIATION_CANDIDATE
          auditor_sha256=d9e6b2bcd1d4e939908c295c764a14dea8ab4b1fb3297b6df1416cf32072ca57
          expected_official_completed_races=2610
          target=2026 current final race universe through pinned source commit; runner gate restricted to JRA turf/dirt finals
          transport=push-trigger compressed exact-auditor one-file
          action_authority=false
          predictive_credit=0
          financial_credit=0
          EOF
          sha256sum multibet_racedata_full_runner_parity_audit_v0_2_1_candidate.py RACEDATA_FULL_2026_CURRENT_RUNNER_PARITY_V021.json > RACEDATA_FULL_2026_CURRENT_SHA256_V021.txt || true
          if [ -f PORTABLE_BT_LEDGER_2026_CURRENT_V021.csv ]; then sha256sum PORTABLE_BT_LEDGER_2026_CURRENT_V021.csv >> RACEDATA_FULL_2026_CURRENT_SHA256_V021.txt; fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multibet-racedata-full-2026-current-runner-parity-v021-496bd254
          path: |
            RACEDATA_FULL_2026_CURRENT_RUNNER_PARITY_V021.json
            PORTABLE_BT_LEDGER_2026_CURRENT_V021.csv
            RACEDATA_FULL_2026_CURRENT_PROVENANCE_V021.txt
            RACEDATA_FULL_2026_CURRENT_SHA256_V021.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce PASS
        if: always()
        shell: bash
        run: |
          python - <<'PY_CHECK'
          import json, pathlib, sys
          p=pathlib.Path('RACEDATA_FULL_2026_CURRENT_RUNNER_PARITY_V021.json')
          if not p.exists():
              print('FAIL: audit report missing'); sys.exit(2)
          r=json.loads(p.read_text())
          keys=['status','expected_official_final_race_count','race_count','netkeiba_race_count','flat_final_race_count',
                'jra_active_runner_count','netkeiba_active_runner_count','netkeiba_joined_runner_count',
                'official_final_race_count_mismatch_count','missing_runner_count','extra_runner_count',
                'duplicate_horse_no_count','missing_horse_id_count','non_10_digit_horse_id_count',
                'duplicate_horse_id_count','horse_name_mismatch_count','no_winner_race_count',
                'canonical_race_join_failure_count','fatal_error']
          print(json.dumps({k:r.get(k) for k in keys},ensure_ascii=False,indent=2))
          sys.exit(0 if r.get('status')=='PASS' else 2)
          PY_CHECK
