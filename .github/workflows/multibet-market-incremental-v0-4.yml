      - name: Download prevalidation checkpoint from successful historical run
        uses: actions/download-artifact@v4
        with:
          name: multibet-prevalidation-checkpoint-v0-1-3
          path: checkpoint
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36353259533

      - name: Download final historical result from successful historical run
        uses: actions/download-artifact@v4
        with:
          name: multibet-final-historical-pipeline-v0-1-3
          path: final
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 36353259533

      - name: Verify frozen historical inputs
        shell: bash
        run: |
          set -euo pipefail
          echo 'b4fafafa90d00559d9840224530d6d1ad958f5bff82be1447307ef3bc8bb8938  checkpoint/features/features.csv' | sha256sum -c -
          echo '296825170854f37e079205a1a69fa34876b031f98a057e6952a6a23d6c17cadb  checkpoint/eval/development_outcomes.csv' | sha256sum -c -
          echo 'd0910097d3065a40b4f27414d29c58aa241f57727b3e945c37c1d96fd8929b26  final/eval/development_temporal_stability.json' | sha256sum -c -

      - name: Install market-stage dependencies
        run: python -m pip install --upgrade 'kagglehub==1.0.2' pandas numpy scipy

      - name: Download public historical JRA final win-odds source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p market_raw market_eval
          python - <<'PY_KAGGLE'
          import kagglehub
          p = kagglehub.dataset_download(
              'takamotoki/jra-horse-racing-dataset',
              path='19860105-20210731_race_result.csv',
              output_dir='market_raw',
          )
          print('MARKET_RAW_PATH=', p)
          PY_KAGGLE
          test -f market_raw/19860105-20210731_race_result.csv
          sha256sum market_raw/19860105-20210731_race_result.csv | tee market_eval/MARKET_RAW_SHA256.txt
          python -m pip show kagglehub > market_eval/KAGGLEHUB_VERSION.txt

      - name: Run frozen strict-OOS market incremental-information test
        shell: bash
        run: |
          set -euo pipefail
          python multibet_market_incremental_evaluator_v0_4.py \
            --features checkpoint/features/features.csv \
            --outcomes checkpoint/eval/development_outcomes.csv \
            --development-json final/eval/development_temporal_stability.json \
            --market-raw market_raw/19860105-20210731_race_result.csv \
            --lock MULTIBET_MARKET_INCREMENTAL_INFORMATION_LOCK_20260928_v0.4.md \
            --output-dir market_eval

      - name: Display frozen market-stage result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f market_eval/MARKET_SOURCE_AUDIT.json && cat market_eval/MARKET_SOURCE_AUDIT.json || true
          test -f market_eval/MARKET_INCREMENTAL_RESULT.json && cat market_eval/MARKET_INCREMENTAL_RESULT.json || true

      - name: Upload market-stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multibet-market-incremental-v0-4
          path: |
            market_eval/
            MULTIBET_MARKET_INCREMENTAL_INFORMATION_LOCK_20260928_v0.4.md
            multibet_market_incremental_evaluator_v0_4.py
          if-no-files-found: error
          retention-days: 30
