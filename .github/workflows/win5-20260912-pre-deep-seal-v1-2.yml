name: WIN5 2026-09-12 PRE Deep Seal v1.2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deep-pre-seal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Enforce PRE cutoff
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(TZ=Asia/Tokyo date '+%Y-%m-%dT%H:%M:%S%z')"
          DATE="$(TZ=Asia/Tokyo date '+%Y-%m-%d')"
          HM="$(TZ=Asia/Tokyo date '+%H%M')"
          echo "deep_seal_start_jst=$NOW"
          test "$DATE" = "2026-09-12"
          if [ "$HM" -ge 1420 ]; then echo '::error::PRE cutoff closed'; exit 41; fi

      - name: Download immutable raw PRE artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p raw_v11 raw_v10
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10289344348/zip" -o raw_v11.zip
          echo '8d17582b26fcb14ce361aec6e1cbc1cc09befa3f50251aead54dd79f2d439148  raw_v11.zip' | sha256sum -c -
          unzip -q raw_v11.zip -d raw_v11
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10289532994/zip" -o raw_v10.zip
          echo '3cf92cf793abfda4546f9681947d002c2912e63fb00e9682ceba0cc64399a793  raw_v10.zip' | sha256sum -c -
          unzip -q raw_v10.zip -d raw_v10

