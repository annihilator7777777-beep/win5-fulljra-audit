      - name: Validate COMMON v0.5
        shell: bash
        run: |
          set -euo pipefail
          cd deep
          python validate_win5_common_pre_manifest_v0_5.py common_v0_5.json -o common_validation.json
          python - <<'PY2'
          import json
          o=json.load(open('common_validation.json'))
          assert o['manifest_integrity']=='PASS_MANIFEST_INTEGRITY',o
          assert o['production_status']=='PASS_PRODUCTION_PRE_CAPTURE',o
          assert o['overall']=='PASS_LIVE_PRODUCTION_WITH_SOURCE_HOLDS',o
          assert o['scorable_sources']==['AIU','MAR'],o
          assert o['held_sources']==['UMZ'],o
          assert o['scheduled_attempt_status']['UMZ']=='PROBABILITY_COHERENCE_FAIL',o
          print('PASS_COMMON_EXPECTED_SOURCE_HOLD',o['manifest_content_sha256'])
          PY2

      - name: Run PRE-result integration-repaired AIU and UMZ deep validators
        shell: bash
        run: |
          set -euo pipefail
          cd deep
          # Repairs are parser/evidence integration only. Captured values and candidate rules are unchanged.
          python AIU_v031_repair.py --production production.csv --aiuma aiu.csv --schedule-manifest schedule.json --day-index-manifest aiu_day_index.json --output aiu_validation_v031.json
          python UMZ_v031_repair.py --production production.csv --umamentz umz.csv --schedule-manifest schedule.json --output umz_validation_v031.json
          python - <<'PY2'
          import json
          a=json.load(open('aiu_validation_v031.json'));u=json.load(open('umz_validation_v031.json'))
          assert a['capture_integrity']=='PASS_PRE_CAPTURE' and a['points']==72
          assert a['all_legs_probability_coherent_by_rounding'] is True
          assert u['capture_integrity']=='PASS_PRE_CAPTURE' and u['points']==72
          assert any(not r['coherent_by_rounding'] for r in u['legs'])
          print('PASS_AIU_DEEP_CAPTURE',a['localized_leg'],a['localized_aiu_pair_delta'])
          print('PASS_UMZ_DEEP_CAPTURE_BUT_COMMON_HOLD',u['localized_leg'],u['localized_umz_pair_delta'])
          PY2

      - name: Bind AIU and UMZ deep outputs to COMMON
        shell: bash
        run: |
          set -euo pipefail
          cd deep
          python binder_v011_repair.py --source AIU --common common_v0_5.json --validator AIU_v031_repair.py --validator-output aiu_validation_v031.json -o aiu_common_binding_v011.json
          python binder_v011_repair.py --source UMZ --common common_v0_5.json --validator UMZ_v031_repair.py --validator-output umz_validation_v031.json -o umz_common_binding_v011.json

      - name: Compute MAR frozen semantics only
        shell: bash
        run: |
          set -euo pipefail
          cd deep
          python MAR_v01_semantics.py --production production.csv --mar mar.csv --output mar_semantics_v01.json
          echo 'MAR formal deep evidence seal remains PENDING because frozen v0.3 evidence-seal script was not recovered; no formal MAR deep-PASS is asserted.'

      - name: Create PRE validation report and hash seal
        shell: bash
        run: |
          set -euo pipefail
          cd deep
          python - <<'PY2'
          import json,hashlib,datetime,pathlib
          P=pathlib.Path('.')
          c=json.load(open('common_validation.json'));a=json.load(open('aiu_validation_v031.json'));u=json.load(open('umz_validation_v031.json'));m=json.load(open('mar_semantics_v01.json'))
          report={
            'schema':'win5-20260912-pre-deep-seal-v1.2',
            'target_date':'2026-09-12',
            'result_fields_read':False,
            'production':'S72_FUKUSHO_FREE v0.1',
            'production_k_vector':[2,4,1,3,3],
            'production_points':72,
            'common':c,
            'aiu_deep':{'capture_integrity':a['capture_integrity'],'localized_leg':a['localized_leg'],'raw_delta':a['localized_aiu_pair_delta'],'all_probability_coherent':a['all_legs_probability_coherent_by_rounding']},
            'umz_deep':{'capture_integrity':u['capture_integrity'],'localized_leg':u['localized_leg'],'raw_delta':u['localized_umz_pair_delta'],'common_eligibility':'HOLD_PROBABILITY_COHERENCE'},
            'mar':{'common_eligibility':'ELIGIBLE_PASS','frozen_v01_semantics_localized_leg':m['localized_leg'],'formal_deep_evidence_seal':'PENDING_EXACT_V03_SCRIPT_NOT_RECOVERED'},
            'validator_repairs':{
              'AIU':{'original_sha':'b9221586a03add12e100ad1006e85109bc9f5024f4042b9c05e8ca65c01f5d94','repair_sha':'98946cd000a4e299e872978ef69407960d1232aa933c160cb6a658619d2635ee','scope':'JRA Japanese time format + provider race-name aliases + all-occurrence raw binding only'},
              'UMZ':{'original_sha':'7ea35314dd0994e4a88391b70db5e5c556fe920e1a2a92d8649da003154f76dd','repair_sha':'5ce4524b9e0368108b41aa75b5676b5480a7463820b5ef2173bfbe028e7b45e0','scope':'JRA Japanese time format + exact per-race URL path only'},
              'binder':{'original_sha':'c36b1dfa352999cb0e0f2ea4cdb5a4c849f0dfdc5b7e699ce6301f5711a7756d','repair_sha':'afc1b1c0b5cdf0ffba1fffd6750db96444a2c833e7a99204ad7adc5c31e8bdd6','scope':'pin repaired validator SHAs only'}
            },
            'governance':{'production_change':False,'ticket_influence':0,'first20_measurement_only':True,'no_source_fusion':True,'no_result_use_before_seal':True}
          }
          P.joinpath('PRE_DEEP_SEAL_REPORT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          files=sorted(x for x in P.iterdir() if x.is_file() and x.name!='SHA256SUMS_DEEP.txt')
          P.joinpath('SHA256SUMS_DEEP.txt').write_text(''.join(f"{hashlib.sha256(x.read_bytes()).hexdigest()}  {x.name}\n" for x in files))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY2

      - name: Upload PRE deep seal artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win5-20260912-pre-deep-seal-v12-${{ github.run_id }}-${{ github.run_attempt }}
          path: deep/
          if-no-files-found: error
          retention-days: 90
