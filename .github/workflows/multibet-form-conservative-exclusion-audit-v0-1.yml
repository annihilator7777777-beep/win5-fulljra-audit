      - name: Download exact frozen DB
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30             -o all_races_2005-2024.db             'https://huggingface.co/datasets/KBlueLeaf/jp-racing-horse/resolve/main/all_races_2005-2024.db?download=true'
          test "$(stat -c%s all_races_2005-2024.db)" = '717680640'
          echo '7828af205838d148f6bca70870d4ab152ea6b54430093dcf3159d23583252eab  all_races_2005-2024.db' | sha256sum -c -

      - name: Build conservative FORM exclusion manifest
        shell: bash
        run: |
          set -euo pipefail
          python form_conservative_exclusion_v0_1.py | tee form_conservative_exclusion_stdout.json

      - name: Assert predictive firewall
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('form_conservative_exclusion/FORM_CONSERVATIVE_EXCLUSION_REPORT_v0.1.json'))
          assert x['status']=='PASS_FORM_CONSERVATIVE_EXCLUSION_AUDIT_COMPLETE'
          assert x['known_controls_excluded'] is True
          assert x['validation_winner_metrics_opened'] is False
          assert x['odds_popularity_payout_read'] is False
          assert x['posthoc_threshold_selected'] is False
          assert x['action_influence']==0
          print('PASS_FORM_SOURCE_FIREWALL_REVIEW_REQUIRED')
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: multibet-form-conservative-exclusion-audit-v0-1
          path: |
            form_conservative_exclusion/
            form_conservative_exclusion_stdout.json
          if-no-files-found: error
          retention-days: 30
