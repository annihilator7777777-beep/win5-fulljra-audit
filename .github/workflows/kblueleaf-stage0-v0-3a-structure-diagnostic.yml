        shell: bash
        run: |
          set -euo pipefail
          rm -rf diag_out
          python diagnose.py all_races_2005-2024.db target949.txt -o diag_out
      - name: Upload small diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kblueleaf-stage0-v0-3a-structure-diagnostic
          path: diag_out/
          if-no-files-found: error
          retention-days: 30
      - name: Remove raw DB
