      - name: Download exact frozen KBlueLeaf DB
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 -o all_races_2005-2024.db 'https://huggingface.co/datasets/KBlueLeaf/jp-racing-horse/resolve/main/all_races_2005-2024.db?download=true'
          test "$(stat -c%s all_races_2005-2024.db)" = '717680640'
          echo '7828af205838d148f6bca70870d4ab152ea6b54430093dcf3159d23583252eab  all_races_2005-2024.db' | sha256sum -c -

      - name: Run closure audit
        shell: bash
        run: |
          set -euo pipefail
          python stagea_closure_audit_v0_3.py | tee stagea_closure_audit_stdout.json

      - name: Assert firewall only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('stagea_closure_audit/STAGEA_CLOSURE_AUDIT_v0.3.json'))
          assert x['status']=='PASS_STAGEA_CLOSURE_AUDIT_RUN_COMPLETE'
          assert x['canonical_races']==16639
          assert x['expected_sha256']=='0040468145d620c6ffa06027fb9ec9926495b0817eb6d7ad22e9a9e9e10eaf02'
          assert x['predictive_metrics_read'] is False
          assert x['winner_labels_used'] is False
          assert x['odds_popularity_payout_read'] is False
          assert x['posthoc_threshold_selected'] is False
          print('PASS_FIREWALL_REVIEW_STILL_REQUIRED')
          PY

      - name: Upload closure audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: multibet-fulljra-stagea-closure-audit-v0-3
          path: |
            stagea_closure_audit/
            stagea_closure_audit_stdout.json
          if-no-files-found: error
          retention-days: 30
